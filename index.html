<head>

  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen select-none">
  <div id="root"></div>

  <script type="text/babel">

      "أكلة ناكلوها بالخبزة": { 'أ':'أمليت', 'ب':'باباغنوج', 'ت':'تونة', 'ج':'جبنة', 'ح':'حمص', 'خ':'خيار مخلل', 'د':'دحية (بيض)', 'ر':'رقاق', 'ز':'زيتون', 'س':'سلاطة', 'ش':'شكشوكة', 'ص':'صلصة', 'ط':'طحينة', 'ع':'عسل', 'غ':'غنوة', 'ف':'فول', 'م':'مربى', 'ن':'نيوتيلا' },
      "شيء لونه أحمر": { 'أ':'أحمر شفاه', 'ب':'بنجر', 'ت':'تفاح', 'ج':'جمر', 'ح':'حناء', 'خ':'خنفساء', 'د':'دم', 'ر':'رمان', 'ز':'زهرة', 'س':'ستروبري (فراولة)', 'ش':'شمع', 'ص':'صلصة', 'ط':'طماطم', 'ع':'عقيق', 'غ':'غلاف', 'ف':'فلفل', 'م':'مرجان', 'ن':'نار' },

      "حيوان يعيش في الماء": { 'أ':'أخطبوط', 'ب':'بلطي', 'ت':'تونة', 'ج':'جمبري', 'ح':'حوت', 'خ':'خيار البحر', 'د':'دلفين', 'ر':'ربيان', 'ز':'زنبق البحر', 'س':'سلطعون', 'ش':'شقائق النعمان', 'ص':'صدفة', 'ط':'طحالب', 'ع':'عنب البحر', 'غ':'غراب البحر', 'ف':'فقمة', 'م':'مرجان', 'ن':'نجم البحر' },
      "نوع من أنواع الفواكه": { 'أ':'أناناس', 'ب':'برتقال', 'ت':'تفاح', 'ج':'جوافة', 'ح':'حبحب (بطيخ)', 'خ':'خوخ', 'د':'دوم', 'ر':'رمان', 'ز':'زيتون', 'س':'سفرجل', 'ش':'شمام', 'ص':'صبر (تين شوكي)', 'ط':'طماطم', 'ع':'عنب', 'غ':'غاب (توت العليق)', 'ف':'فراولة', 'م':'موز', 'ن':'نبق' },
      "شيء تلقاه في حوش العيلة": { 'أ':'أريكة', 'ب':'براد', 'ت':'تلفزيون', 'ج':'جلاية (سجادة)', 'ح':'حوض', 'خ':'خزانة', 'د':'ديكور', 'ر':'راديو', 'ز':'زيت', 'س':'ساعة', 'ش':'شاحن', 'ص':'صالون', 'ط':'طاولة', 'ع':'عطر', 'غ':'غسالة', 'ف':'فنجان', 'م':'مفرش', 'ن':'نظارة' },

      "برنامج أو تطبيق موجود في تليفونك": { 'أ':'إنستغرام', 'ب':'بينترست', 'ت':'تليجرام', 'ج':'جيمايل', 'ح':'حاسبة', 'خ':'خرائط', 'د':'ديسكورد', 'ر':'ريديت', 'ز':'زوم', 'س':'سنابشات', 'ش':'شاهد', 'ص':'صراحة', 'ط':'طيران', 'ع':'عقارات', 'غ':'جوجل', 'ف':'فيسبوك', 'م':'واتساب (مسنجر)', 'ن':'نتفليكس' },
      "مهنة تحتاج لبس معين (زي رسمي)": { 'أ':'أستاذ', 'ب':'بحار', 'ت':'تاجر', 'ج':'جراح', 'ح':'حارس', 'خ':'خباز', 'د':'دكتور', 'ر':'رائد فضاء', 'ز':'زبال', 'س':'سائق', 'ش':'شرطي', 'ص':'صياد', 'ط':'طيار', 'ع':'عسكري', 'غ':'غواص', 'ف':'فني', 'م':'مهندس', 'ن':'نادل' },
      "رياضة أو لعبة تلعبها بالكرة": { 'أ':'أيروبيك', 'ب':'بولينج', 'ت':'تنس', 'ج':'جولف', 'ح':'حارس مرمى', 'خ':'خماسي', 'د':'دبابيس', 'ر':'رغبي', 'ز':'زجاجيات', 'س':'سلة', 'ش':'شاطئية', 'ص':'صالة', 'ط':'طاولة', 'ع':'طائرة', 'غ':'جولف', 'ف':'فوتسال', 'م':'مضرب', 'ن':'نيشان' },
      "حاجة تلبسها في الشتاء بس": { 'أ':'أوشحة', 'ب':'بالطو', 'ت':'توتة', 'ج':'جاكيت', 'ح':'حذاء شتوي', 'خ':'خوذة', 'د':'دفاية', 'ر':'رداء', 'ز':'زبون', 'س':'سترة', 'ش':'شال', 'ص':'صوف', 'ط':'طاقية', 'ع':'عباءة', 'غ':'غطاء رأس', 'ف':'فرو', 'م':'معطف', 'ن':'نعال فرو' },
      "حيوان أو حشرة تخاف منها": { 'أ':'أفعى', 'ب':'بعوضة', 'ت':'تمساح', 'ج':'جرادة', 'ح':'حية', 'خ':'خفاش', 'د':'دبور', 'ر':'رتيلاء', 'ز':'زنبور', 'س':'سحلية', 'ش':'شاذي', 'ص':'صرصور', 'ط':'طفيلي', 'ع':'عقرب', 'غ':'غراب', 'ف':'فأر', 'م':'أم أربعة وأربعين', 'ن':'نمس' },
      "شيء نطيّبوه أو نديروه في رمضان": { 'أ':'أرز', 'ب':'بوريك', 'ت':'تمر', 'ج':'جلاب', 'ح':'حلوى', 'خ':'خبزة', 'د':'دششة', 'ر':'رشتة', 'ز':'زلابية', 'س':'سلطة', 'ش':'شوربة', 'ص':'صينية', 'ط':'طاجين', 'ع':'عصيدة', 'غ':'غريبة', 'ف':'فتات', 'م':'محشي', 'ن':'نويصرة' },
      "أكثر شيء يخلّي الوالد أو الوالدة يتعصبوا": { 'أ':'إهمال', 'ب':'براد مفتوح', 'ت':'تأخير', 'ج':'جواب رد', 'ح':'حس عالي', 'خ':'خراب', 'د':'دوشة', 'ر':'رد لسان', 'ز':'زبلة', 'س':'سهر', 'ش':'شجار', 'ص':'صوت عالي', 'ط':'طيش', 'ع':'عدم احترام', 'غ':'غياب', 'ف':'فوضى', 'م':'موبايل', 'ن':'نوم زيادة' },
      "عذر أو سبّلة تقولها لما تعطّل على موعدك": { 'أ':'أزحمة', 'ب':'بنشر', 'ت':'تاكسي ما لقيتش', 'ج':'جاري عطلني', 'ح':'حادث', 'خ':'خربت السيارة', 'د':'دوخة', 'ر':'رحت ضعت', 'ز':'زحمة', 'س':'سيارة ما ولعتش', 'ش':'شحن كمل', 'ص':'صحيت مؤخر', 'ط':'طريق واقفة', 'ع':'عطلة', 'غ':'غلق باب', 'ف':'فلوس نسحب', 'م':'مطر', 'ن':'نسيت' },
      "شيء تشتريه من السوبرماركت / الدكان": { 'أ':'أرز', 'ب':'بسكويت', 'ت':'تونة', 'ج':'جبنة', 'ح':'حليب', 'خ':'خبز', 'د':'دقيق', 'ر':'رقائق بطاطس', 'ز':'زيت', 'س':'سكر', 'ش':'شاي', 'ص':'صابون', 'ط':'طماطم علب', 'ع':'عصير', 'غ':'غسول', 'ف':'فول علب', 'م':'ماء', 'ن':'نيوتيلا' },
      "دولة عربية أو أجنبية": { 'أ':'ألجيريا', 'ب':'البحرين', 'ت':'تونس', 'ج':'جيبوتي', 'ح':'حبشة', 'خ':'خارجية', 'د':'دنمارك', 'ر':'روسيا', 'ز':'زيمبابوي', 'س':'سعودية', 'ش':'شيلي', 'ص':'صين', 'ط':'طاجيكستان', 'ع':'عمان', 'غ':'غانا', 'ف':'فرنسا', 'م':'مصر', 'ن':'نرويج' },
      "حاجة تلقاها في المطبخ": { 'أ':'أواني', 'ب':'براد', 'ت':'تنجرة', 'ج':'جلاية', 'ح':'حوض غسيل', 'خ':'خلاط', 'د':'دورق', 'ر':'رفوف', 'ز':'زيت', 'س':'سكين', 'ش':'شوكة', 'ص':'صحن', 'ط':'طاولة', 'ع':'عصارة', 'غ':'غلاية', 'ف':'فرن', 'م':'ملعقة', 'ن':'ملاحة' },
      "صفة حلوة أو شينة في البنادم": { 'أ':'أمين', 'ب':'بخيل', 'ت':'تسامح', 'ج':'جبان', 'ح':'حنون', 'خ':'خائن', 'د':'دقيق', 'ر':'رحيم', 'ز':'زاهد', 'س':'سموح', 'ش':'شجاع', 'ص':'صادق', 'ط':'طيب', 'ع':'عادل', 'غ':'غدار', 'ف':'فظ', 'م':'محترم', 'ن':'نذل' },
      "شيء نلقوه في البحر أو الشاطئ": { 'أ':'أمواج', 'ب':'بحر', 'ت':'تراب', 'ج':'جمبري', 'ح':'حوت', 'خ':'خيمة', 'د':'دلفين', 'ر':'رمل', 'ز':'زوارق', 'س':'سلطعون', 'ش':'شمسية', 'ص':'صدف', 'ط':'طحالب', 'ع':'عوامة', 'غ':'غواص', 'ف':'فقمة', 'م':'مرجان', 'ن':'نورس' },
      "مشروب بارد أو ساخن": { 'أ':'أناناس', 'ب':'بيبسي', 'ت':'توت', 'ج':'جوافة', 'ح':'حليب', 'خ':'خروب', 'د':'دارسين', 'ر':'رمان', 'ز':'زنجبيل', 'س':'سبرايت', 'ش':'شاهي', 'ص':'سحلب', 'ط':'طاقة', 'ع':'عصير', 'غ':'غازيات', 'ف':'فراولة', 'م':'ماء', 'ن':'نسكافيه' }
    };

    const CHAOS_CARDS = [
      { id: 'statue', title: 'التمثال', desc: 'تجمّد مكانك وما تتحركش ولا تتكلم دور كامل! لو تحركت تروح عليك النقطة.' },
      { id: 'tongue', title: 'اللسان المربوط', desc: 'عض على لسانك وجاوب.. لو ضحكت أو ما فهموكش، النقطة تطير لغيرك.' },
      { id: 'double', title: 'مضاعفة النقاط 🔥', desc: 'فرصة ذهبية! الإجابة الصحيحة في هذا الدور تعطيك نقطتين (+2) بدلاً من نقطة واحدة.' },
      { id: 'radar', title: 'الرادار', desc: 'اختار واحد من المقمعزين واحظره؛ ممنوع يشارك أو يفتح فمه الدور الجاي.' },
      { id: 'blitz', title: 'السرعة الفائقة ⚡', desc: 'الوقت ضيق جداً! العداد ينزل لـ 5 ثوانٍ فقط في هذا الدور.' },
      { id: 'swap', title: 'قلب السحر', desc: 'بدل نقاطك الحالية مع أكثر واحد مجمع نقاط على الطاولة وتكسب شوط جديد.' },
      { id: 'reverse', title: 'العكس', desc: 'اتجاه اللعب ينقلب 180 درجة! لو ماشي يمين يرجع يسار طول.' },
      { id: 'condition', title: 'الشرط الوعر', desc: 'لازم تبدأ إجابتك الجاية بكلمة "يا خوي" أو "يا حنة" وإلا إجابتك ملغية.' },
      { id: 'tax', title: 'الضرائب (الإفلاس)', desc: 'حظك اليوم مش تمام! تخسر نقطة واحدة من نقاطك الحالية.' }
    ];

    function App() {
      const [players, setPlayers] = React.useState([]);
      const [newPlayerName, setNewPlayerName] = React.useState('');
      const [scores, setScores] = React.useState({});
      const [targetScore, setTargetScore] = React.useState(5); // الهدف التلقائي 5 نقاط
      const [winner, setWinner] = React.useState(null);

      const [activePlayerIndex, setActivePlayerIndex] = React.useState(0);
      const [isReversed, setIsReversed] = React.useState(false);

      const [categoriesDeck, setCategoriesDeck] = React.useState(CATEGORIES);
      const [currentCategory, setCurrentCategory] = React.useState(null);
      const [currentLetter, setCurrentLetter] = React.useState(null);
      const [activeChaos, setActiveChaos] = React.useState(null);
      const [showChaosModal, setShowChaosModal] = React.useState(false);

      const [timer, setTimer] = React.useState(10);
      const [isTimerRunning, setIsTimerRunning] = React.useState(false);
      const [gamePhase, setGamePhase] = React.useState('IDLE');
      const [showSuggestion, setShowSuggestion] = React.useState(false);

      React.useEffect(() => {
        let interval = null;
        if (isTimerRunning && timer > 0) {
          interval = setInterval(() => setTimer((t) => t - 1), 1000);
        } else if (timer === 0 && isTimerRunning) {
          clearInterval(interval);
          setIsTimerRunning(false);
          if (gamePhase === 'PRIORITY') {
            setGamePhase('DECISION_PRIORITY');
          }
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timer, gamePhase]);

      // إطلاق الألعاب النارية عند وجود فائز
      React.useEffect(() => {
        if (winner && typeof confetti === 'function') {
          const duration = 3 * 1000;
          const end = Date.now() + duration;

          const frame = () => {
            confetti({
              particleCount: 5,
              angle: 60,
              spread: 55,
              origin: { x: 0 }
            });
            confetti({
              particleCount: 5,
              angle: 120,
              spread: 55,
              origin: { x: 1 }
            });

            if (Date.now() < end) {
              requestAnimationFrame(frame);
            }
          };
          frame();
        }
      }, [winner]);

      const addPlayer = () => {
        if (newPlayerName.trim() !== '') {
          const name = newPlayerName.trim();
          if (!players.includes(name)) {
            setPlayers([...players, name]);
            setScores((prev) => ({ ...prev, [name]: 0 }));
            setNewPlayerName('');
          }
        }
      };

      const removePlayer = (nameToRemove) => {
        const updatedPlayers = players.filter((p) => p !== nameToRemove);
        setPlayers(updatedPlayers);
        
        const newScores = { ...scores };
        delete newScores[nameToRemove];
        setScores(newScores);

        if (activePlayerIndex >= updatedPlayers.length) {
          setActivePlayerIndex(0);
        }
      };

      const getNextPlayerIndex = (currentIdx) => {
        if (players.length === 0) return 0;
        return !isReversed
          ? (currentIdx + 1) % players.length
          : (currentIdx - 1 + players.length) % players.length;
      };

      const advanceTurn = () => {
        setActivePlayerIndex(getNextPlayerIndex(activePlayerIndex));
        setGamePhase('IDLE');
        setTimer(10);
        setShowSuggestion(false);
        setActiveChaos(null);
      };

      const drawRound = () => {
        if (players.length === 0) return;

        let availableCategories = categoriesDeck.length > 0 ? categoriesDeck : CATEGORIES;
        const randomIndex = Math.floor(Math.random() * availableCategories.length);
        const selectedCategory = availableCategories[randomIndex];

        setCategoriesDeck(availableCategories.filter((_, idx) => idx !== randomIndex));

        setCurrentCategory(selectedCategory);
        setCurrentLetter(LETTERS[Math.floor(Math.random() * LETTERS.length)]);

        let initialTimer = 10;

        if (Math.random() < 0.25) {
          const randomChaos = CHAOS_CARDS[Math.floor(Math.random() * CHAOS_CARDS.length)];
          setActiveChaos(randomChaos);
          setShowChaosModal(true);
          
          if (randomChaos.id === 'reverse') setIsReversed((prev) => !prev);
          if (randomChaos.id === 'blitz') initialTimer = 5;
          if (randomChaos.id === 'tax') {
            const currentP = players[activePlayerIndex];
            setScores((prev) => ({ ...prev, [currentP]: Math.max(0, (prev[currentP] || 0) - 1) }));
          }
        } else {
          setShowChaosModal(false);
          setActiveChaos(null);
        }

        setTimer(initialTimer);
        setGamePhase('PRIORITY');
        setIsTimerRunning(true);
        setShowSuggestion(false);
      };

      const handleAwardPoint = (playerName) => {
        const pointsToAdd = (activeChaos && activeChaos.id === 'double') ? 2 : 1;
        const newScore = (scores[playerName] || 0) + pointsToAdd;

        setScores((prev) => ({
          ...prev,
          [playerName]: newScore
        }));

        // التحقق من شرط الفوز باللعبة
        if (targetScore > 0 && newScore >= targetScore) {
          setWinner(playerName);
          setIsTimerRunning(false);
        } else {
          advanceTurn();
        }
      };

      const handleNoWinner = () => {
        if (currentCategory) {
          setCategoriesDeck((prev) => [...prev, currentCategory]);
        }
        advanceTurn();
      };

      const resetGame = () => {
        setWinner(null);
        setScores(players.reduce((acc, p) => ({ ...acc, [p]: 0 }), {}));
        setGamePhase('IDLE');
        setCurrentCategory(null);
        setCurrentLetter(null);
        setActiveChaos(null);
      };

      const getSuggestedAnswer = () => {
        if (!currentCategory || !currentLetter) return "لا يوجد تلميح متوفر";
        if (SUGGESTIONS[currentCategory] && SUGGESTIONS[currentCategory][currentLetter]) {
          return SUGGESTIONS[currentCategory][currentLetter];
        }
        return `فكر في كلمة تنتمي لـ (${currentCategory}) تبدأ بحرف (${currentLetter})`;
      };

      return (
        <div className="min-h-screen p-4 flex flex-col items-center justify-between max-w-xl mx-auto">
          {/* الهيدر */}
          <header className="w-full text-center my-2">
            <h1 className="text-3xl font-extrabold text-amber-400 mb-1">🎲 كارت وكلمة</h1>
            
            {/* اختيار هدف نقاط الفوز */}
            <div className="flex items-center justify-center gap-2 mb-3 text-xs text-slate-300">
              <span>هدف الفوز:</span>
              <select
                value={targetScore}
                onChange={(e) => setTargetScore(Number(e.target.value))}
                className="bg-slate-800 border border-slate-600 rounded px-2 py-0.5 text-amber-300 font-bold"
              >
                <option value={3}>3 نقاط (سريع)</option>
                <option value={5}>5 نقاط (قياسي)</option>
                <option value={10}>10 نقاط (طويل)</option>
                <option value={0}>بدون حد (مفتوح)</option>
              </select>
            </div>

            {players.length > 0 && (
              <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 flex justify-between items-center text-sm">
                <span className="text-gray-400">الدور الحالي:</span>
                <span className="text-lg font-bold text-emerald-400">{players[activePlayerIndex]}</span>
                {isReversed && <span className="bg-red-900/60 text-red-300 px-2 py-0.5 rounded text-xs">🔄 معكوس</span>}
              </div>
            )}
          </header>

          {/* محتوى اللعبة الرئيسي */}
          {players.length === 0 ? (
            <div className="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full text-center my-auto">
              <h2 className="text-xl font-bold text-amber-300 mb-3">أضف اللاعبين للبدء 👥</h2>
              <div className="flex gap-2 mb-4">
                <input
                  type="text"
                  placeholder="اسم اللاعب..."
                  value={newPlayerName}
                  onChange={(e) => setNewPlayerName(e.target.value)}
                  className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-white"
                />
                <button onClick={addPlayer} className="bg-emerald-600 hover:bg-emerald-500 font-bold px-4 py-2 rounded-lg">إضافة</button>
              </div>
            </div>
          ) : (
            <main className="w-full flex flex-col gap-4 my-auto">
              <div className="grid grid-cols-2 gap-3">
                <div className="bg-[#116b32] border-2 border-emerald-400 rounded-xl p-4 min-h-[150px] flex flex-col justify-center items-center text-center">
                  <span className="text-xs bg-emerald-900/60 text-emerald-200 px-2 py-0.5 rounded-full mb-2">الفئة</span>
                  <p className="text-base font-bold">{currentCategory || "اضغط سحب دور"}</p>
                </div>

                <div className="bg-[#003c8f] border-2 border-blue-400 rounded-xl p-4 min-h-[150px] flex flex-col justify-center items-center text-center">
                  <span className="text-xs bg-blue-900/60 text-blue-200 px-2 py-0.5 rounded-full mb-2">الحرف</span>
                  <span className="text-5xl font-black text-amber-300">{currentLetter || "؟"}</span>
                </div>
              </div>

              {/* التنبيه بوجود كرت فوضى نشط */}
              {activeChaos && (
                <div className="bg-red-950/80 border border-red-500/80 text-red-200 text-xs p-2 rounded-lg text-center font-bold animate-pulse">
                  🃏 كرت الفوضى المفعّل: <span className="text-amber-300">{activeChaos.title}</span> ({activeChaos.desc})
                </div>
              )}

              {/* زر ومساحة الاقتراح المباشر */}
              {currentCategory && (
                <div className="w-full text-center">
                  {!showSuggestion ? (
                    <button
                      onClick={() => setShowSuggestion(true)}
                      className="text-xs bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/40 px-3 py-1.5 rounded-lg font-semibold transition-all"
                    >
                      💡 عرض إجابة مقترحة
                    </button>
                  ) : (
                    <div className="bg-amber-950/60 border border-amber-500/60 p-2.5 rounded-xl text-amber-200 text-sm animate-fade-in">
                      💡 إجابة مقترحة: <span className="font-extrabold text-amber-400 text-base">{getSuggestedAnswer()}</span>
                    </div>
                  )}
                </div>
              )}

              {/* العداد والتحكم */}
              <div className="bg-slate-800 p-3 rounded-xl text-center border border-slate-700">
                <div className="text-xs text-gray-400 mb-1">
                  {gamePhase === 'PRIORITY' && `أولوية الإجابة لـ: (${players[activePlayerIndex]})`}
                  {gamePhase === 'DECISION_PRIORITY' && "هل أجاب صاحب الدور؟"}
                  {gamePhase === 'DECISION_OPEN' && "اختر من الفائز بالنقطة:"}
                  {gamePhase === 'IDLE' && "جاهز للدور الجديد"}
                </div>
                <div className={`text-4xl font-black ${timer <= 3 && isTimerRunning ? 'text-red-500 animate-pulse' : 'text-amber-400'}`}>
                  00:{timer < 10 ? `0${timer}` : timer}
                </div>
              </div>

              {/* أزرار الإجراءات حسب الحالة */}
              {gamePhase === 'PRIORITY' && (
                <button
                  onClick={() => { setIsTimerRunning(false); setGamePhase('DECISION_PRIORITY'); }}
                  className="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl shadow-lg"
                >
                  حسم الإجابة ⏱️
                </button>
              )}

              {gamePhase === 'DECISION_PRIORITY' && (
                <div className="flex flex-col gap-2 bg-slate-800 p-3 rounded-xl border border-slate-700">
                  <p className="text-center text-sm font-bold">هل أجاب ({players[activePlayerIndex]}) إجابة صحيحة؟</p>
                  <div className="flex gap-2">
                    <button
                      onClick={() => handleAwardPoint(players[activePlayerIndex])}
                      className="flex-1 bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded-lg"
                    >
                      نعم ({(activeChaos && activeChaos.id === 'double') ? '+2 نقطة 🔥' : '+1 نقطة 👍'})
                    </button>
                    <button
                      onClick={() => setGamePhase('DECISION_OPEN')}
                      className="flex-1 bg-amber-600 hover:bg-amber-500 font-bold py-2 rounded-lg"
                    >
                      لا (فتح المزاد) 📢
                    </button>
                  </div>
                </div>
              )}

              {gamePhase === 'DECISION_OPEN' && (
                <div className="bg-slate-800 p-3 rounded-xl border border-slate-700 text-center">
                  <p className="text-sm font-bold mb-2">من أجاب أولاً من الطاولة؟</p>
                  <div className="flex flex-wrap gap-2 justify-center mb-3">
                    {players.map((p, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleAwardPoint(p)}
                        className="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded-lg text-sm font-bold"
                      >
                        {p}
                      </button>
                    ))}
                  </div>
                  <button
                    onClick={handleNoWinner}
                    className="w-full bg-red-800 hover:bg-red-700 text-xs font-bold py-2 rounded-lg"
                  >
                    لا أحد أجاب (إعادة الكرت لأسفل المجموعة) 🔄
                  </button>
                </div>
              )}

              {gamePhase === 'IDLE' && (
                <div className="flex gap-2">
                  <button onClick={drawRound} className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg">
                    🎴 سحب دور جديد
                  </button>
                  <button onClick={advanceTurn} className="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-4 py-3 rounded-xl">
                    تخطي ⏭️
                  </button>
                </div>
              )}
            </main>
          )}

          {/* نافذة كرت الفوضى Popup */}
          {showChaosModal && activeChaos && (
            <div className="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
              <div className="bg-[#800000] border-2 border-red-500 rounded-2xl p-5 max-w-xs w-full text-center shadow-2xl">
                <h2 className="text-xl font-bold text-amber-300 mb-2">🃏 {activeChaos.title}</h2>
                <p className="text-sm bg-red-950/50 p-2 rounded mb-4">{activeChaos.desc}</p>
                <button onClick={() => setShowChaosModal(false)} className="w-full bg-amber-400 text-slate-950 font-bold py-2 rounded-lg">
                  موافق 👍
                </button>
              </div>
            </div>
          )}

          {/* شاشة التتويج والاحتفال بالفائز 🎉 */}
          {winner && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border-2 border-amber-400 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
                <div className="text-6xl mb-3">🏆 🎉</div>
                <h2 className="text-2xl font-black text-amber-400 mb-1">مبروووك الفوز!</h2>
                <p className="text-lg text-emerald-400 font-extrabold mb-4">{winner}</p>
                <p className="text-sm text-slate-300 mb-6">
                  وصل إلى <span className="text-amber-300 font-bold">{scores[winner]} نقاط</span> وحسم اللعبة بجدارة!
                </p>
                <button
                  onClick={resetGame}
                  className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-lg shadow-lg"
                >
                  لعب شوط جديد 🔄
                </button>
              </div>
            </div>
          )}

          {/* لوحة التحكم باللاعبين والنقاط وحذفهم */}
          <footer className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 mt-4">
            <div className="flex gap-2 mb-3">
              <input
                type="text"
                placeholder="إضافة لاعب إضافي..."
                value={newPlayerName}
                onChange={(e) => setNewPlayerName(e.target.value)}
                className="flex-1 bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-white"
              />
              <button onClick={addPlayer} className="bg-emerald-600 text-sm px-3 py-1 rounded font-bold">إضافة</button>
            </div>
            
            <div className="flex flex-wrap gap-2">
              {players.map((p, idx) => (
                <div
                  key={idx}
                  className={`text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-2 border ${
                    idx === activePlayerIndex ? 'bg-emerald-900 border-emerald-400 text-emerald-200 font-bold' : 'bg-slate-900 border-slate-700'
                  }`}
                >
                  <span>{p}</span>
                  <span className="bg-amber-400 text-slate-950 px-1.5 py-0.5 rounded-full text-[10px] font-black">
                    {scores[p] || 0} / {targetScore > 0 ? targetScore : '∞'}
                  </span>
                  <button
                    onClick={() => removePlayer(p)}
                    className="text-red-400 hover:text-red-200 font-bold ml-1 text-sm"
                    title="حذف اللاعب"
                  >
                    ✕
                  </button>
                </div>
              ))}
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
